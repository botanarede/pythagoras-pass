name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concorrência serializada no workflow completo com cancel-in-progress: false
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate-and-package-integrated:
    name: Integrated E2E Validation & Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build Production PWA Artifact
        run: npm run build
        env:
          BASE_PATH: '/pythagoras-pass/'

      - name: Run Playwright E2E Suite on Integrated Artifact
        run: npx playwright test
        env:
          CI: 'true'
          BASE_PATH: '/pythagoras-pass/'

      - name: Validate E2E Gate Results
        run: |
          node scripts/validate-ci-gate.mjs \
            --context deploy \
            --validate-and-package-integrated "success"

      - name: Record Validated Artifact SHA
        run: |
          echo "${{ github.sha }}" > dist/.verified-sha
          echo "Validated commit: ${{ github.sha }}"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-to-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-package-integrated
    steps:
      - name: Checkout Code for Remote SHA Guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remote Main SHA Guard (Anti-Stale Check)
        run: |
          REMOTE_SHA=$(git rev-parse origin/main)
          EXPECTED_SHA="${{ github.sha }}"
          echo "Expected SHA from build: $EXPECTED_SHA"
          echo "Remote main HEAD SHA:    $REMOTE_SHA"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Guard Abort: Remote main advanced ($REMOTE_SHA) and does not match the verified artifact ($EXPECTED_SHA). Aborting deployment to preserve production integrity."
            exit 1
          fi
          echo "Guard Verification Passed: Remote main matches verified artifact SHA."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
